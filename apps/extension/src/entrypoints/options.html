<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextLines 设置</title>
  </head>
  <body>
    <main>
      <div class="brand">Q</div>
      <h1>连接模型</h1>
      <p class="intro">
        只需设置一次。密钥保存在这台电脑的 Chrome 扩展存储中，不会发送给网页。
      </p>
      <form id="form">
        <label
          >豆包 APP ID<input
            id="doubao-app-id"
            name="doubao-app-id"
            type="text"
            autocomplete="off"
            required
            placeholder="服务接口认证信息左侧的 APP ID" /></label
        ><label
          >豆包 Access Token<input
            id="doubao-access-token"
            name="doubao-access-token"
            type="password"
            autocomplete="off"
            required
            placeholder="服务接口认证信息中间的 Access Token" /></label
        ><small>使用小时版服务；Secret Key 不需要填写</small
        ><label
          >DeepSeek API Key<input
            id="deepseek"
            name="deepseek"
            type="password"
            autocomplete="off"
            required
            placeholder="sk-..." /></label
        ><button type="submit">保存设置</button>
        <p id="status" role="status"></p>
      </form>
      <p class="privacy">
        密钥会持久保存在
        <code>chrome.storage.local</code>，并仅由扩展后台直接请求豆包和
        DeepSeek。卸载扩展会删除这些设置。
      </p>
    </main>
    <script type="module" src="./options/main.ts"></script>
  </body>
</html>
