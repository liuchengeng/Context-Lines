<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextLines 设置</title>
  </head>
  <body>
    <main>
      <div class="brand">Q</div>
      <h1>连接中转服务</h1>
      <p class="intro">
        扩展只连接你自己的 Cloudflare Worker。豆包和 DeepSeek 密钥保存在
        Cloudflare Secrets，不再保存在 Chrome。
      </p>
      <form id="form">
        <label
          >Worker 地址<input
            id="relay-url"
            name="relay-url"
            type="url"
            autocomplete="off"
            required
            placeholder="https://contextlines-relay.你的名称.workers.dev" /></label
        ><label
          >连接口令<input
            id="relay-token"
            name="relay-token"
            type="password"
            autocomplete="off"
            required
            placeholder="部署时生成的随机口令" /></label
        ><small>这里只填 Worker 地址和连接口令，不要填写模型密钥。</small
        ><button type="submit">检查并保存</button>
        <p id="status" role="status"></p>
      </form>
      <p class="privacy">
        Chrome 只保存 Worker 地址与连接口令。最近 10 秒音频仅在你按
        <code>Alt+Q</code> 后，经 Worker 转发给豆包；识别文本再发给 DeepSeek。
      </p>
    </main>
    <script type="module" src="./options/main.ts"></script>
  </body>
</html>
